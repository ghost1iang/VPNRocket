<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配置修改控制台</title>
    <style>
        :root {
            --primary: #007AFF;
            --danger: #FF3B30;
            --bg-color: #f5f5f7;
            --text-main: #1d1d1f;
            --card-bg: #ffffff;
            --border: #e5e5ea;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .rule-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            gap: 10px;
        }
        .rule-item:last-child {
            border-bottom: none;
        }
        input, select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
        }
        .domain-input {
            flex-grow: 1;
        }
        button {
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-add { background-color: #34C759; color: white; margin-bottom: 20px; display: inline-block;}
        .btn-delete { background-color: var(--danger); color: white; padding: 10px; }
        .btn-save { background-color: var(--primary); color: white; width: 100%; font-size: 18px; padding: 16px; margin-top: 20px;}
        .btn-back { background-color: #8e8e93; color: white; text-decoration: none; display: inline-block; padding: 10px 20px; margin-bottom: 20px;}
        
        .loading { text-align: center; padding: 40px; color: #8e8e93; }
        .hint { font-size: 13px; color: #8e8e93; margin-top: -15px; margin-bottom: 15px;}
        
        .notice {
            background-color: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-back">← 返回教程页</a>
    <header>
        <h1>⚙️ 配置修改控制台</h1>
        <p>在此直接添加或修改您的分流规则</p>
    </header>

    <div class="notice">
        <b>📝 保存须知：</b>由于网页无法直接修改服务器文件，点击“生成并下载”后，手机浏览器会下载一个 <code>SmartRoute.conf</code> 文件。<br>
        如果您在苹果手机上操作：下载完成后，点击文件选择<b>“在 Shadowrocket 中打开”</b>，即可立刻更新手机内的配置！
    </div>

    <div class="card" id="editor-container">
        <div id="loading" class="loading">正在读取服务器配置...</div>
        <div id="editor-content" style="display: none;">
            <h3>当前规则列表</h3>
            <p class="hint">填写域名后缀，并选择走代理(Auto_Switch)还是直连(DIRECT)</p>
            
            <button class="btn-add" onclick="addRule()">+ 添加新规则</button>
            
            <div id="rules-list">
                <!-- Rules will be populated here -->
            </div>

            <button class="btn-save" onclick="generateConfig()">💾 生成并下载新配置</button>
        </div>
    </div>
</div>

<script>
    let configHeader = '';
    let rules = [];
    let configFooter = '\n# === 兜底直连 ===\nFINAL,DIRECT\n';

    // Load existing config
    async function loadConfig() {
        try {
            const response = await fetch('config/SmartRoute.conf?' + new Date().getTime());
            if (!response.ok) throw new Error("获取配置失败");
            const text = await response.text();
            parseConfig(text);
        } catch (error) {
            document.getElementById('loading').innerText = "加载失败，请确保文件位于 config/SmartRoute.conf";
            console.error(error);
        }
    }

    function parseConfig(text) {
        const parts = text.split('[Rule]');
        if (parts.length < 2) {
            alert("配置文件格式不正确，找不到 [Rule] 标签");
            return;
        }
        
        configHeader = parts[0] + '[Rule]\n';
        const ruleSection = parts[1];
        
        const lines = ruleSection.split('\n');
        for (let line of lines) {
            line = line.trim();
            if (line.startsWith('DOMAIN-SUFFIX')) {
                const parts = line.split(',');
                if (parts.length >= 3) {
                    rules.push({
                        domain: parts[1],
                        policy: parts[2]
                    });
                }
            }
        }
        
        renderRules();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('editor-content').style.display = 'block';
    }

    function renderRules() {
        const listDiv = document.getElementById('rules-list');
        listDiv.innerHTML = '';
        
        rules.forEach((rule, index) => {
            const item = document.createElement('div');
            item.className = 'rule-item';
            
            item.innerHTML = `
                <input type="text" class="domain-input" value="${rule.domain}" onchange="updateRule(${index}, 'domain', this.value)" placeholder="例如: baidu.com">
                <select onchange="updateRule(${index}, 'policy', this.value)">
                    <option value="Auto_Switch" ${rule.policy === 'Auto_Switch' ? 'selected' : ''}>回国加速 (Auto_Switch)</option>
                    <option value="DIRECT" ${rule.policy === 'DIRECT' ? 'selected' : ''}>直连 (DIRECT)</option>
                    <option value="PROXY" ${rule.policy === 'PROXY' ? 'selected' : ''}>强制代理 (PROXY)</option>
                </select>
                <button class="btn-delete" onclick="deleteRule(${index})">删除</button>
            `;
            listDiv.appendChild(item);
        });
    }

    function addRule() {
        rules.unshift({ domain: '', policy: 'Auto_Switch' });
        renderRules();
    }

    function updateRule(index, field, value) {
        rules[index][field] = value;
    }

    function deleteRule(index) {
        if(confirm("确定要删除这条规则吗？")) {
            rules.splice(index, 1);
            renderRules();
        }
    }

    function generateConfig() {
        // Clean empty rules
        const validRules = rules.filter(r => r.domain.trim() !== '');
        
        let newRulesText = "\n# === 用户自定义域名规则 ===\n";
        validRules.forEach(rule => {
            newRulesText += `DOMAIN-SUFFIX,${rule.domain.trim()},${rule.policy}\n`;
        });

        const finalConfig = configHeader + newRulesText + configFooter;

        // Download logic
        const blob = new Blob([finalConfig], { type: 'text/plain;charset=utf-8' });
        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = 'SmartRoute.conf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);
        
        alert("文件已生成并触发下载！\n如果您使用的是手机，请在下载完成后点击文件，选择【在 Shadowrocket 中打开】来更新配置。");
    }

    // Initialize
    window.onload = loadConfig;
</script>

</body>
</html>
